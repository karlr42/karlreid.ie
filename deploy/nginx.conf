# Install after validating against the upgraded NGINX binary.
# HTTP/2 stays disabled until the installed package's security fixes are verified.
server {
    listen 80;
    listen [::]:80;
    server_name karlreid.ie www.karlreid.ie;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        try_files $uri =404;
    }
    location / { return 301 https://karlreid.ie$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.karlreid.ie;
    ssl_certificate /etc/letsencrypt/live/karlreid.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karlreid.ie/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://karlreid.ie$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name karlreid.ie;
    root /var/www/karlreid/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/karlreid.ie/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karlreid.ie/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
